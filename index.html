<!DOCTYPE html>
<html>
<head>
  <title>CLASSIC RESTAURANT</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Food Menu</h1>

  <!-- Search Bar -->
  <input type="text" id="searchInput" placeholder="Search menu..." onkeyup="filterMenu()">

  <!-- Category Filter Buttons -->
  <div class="filter-buttons">
    <button onclick="filterCategory('all', this)">All</button>
    <button onclick="filterCategory('meals', this)">Meals</button>
    <button onclick="filterCategory('drinks', this)">Drinks</button>
  </div>

  <!-- Item Counter Line -->
  <p id="itemCount">Showing 3 items</p>

  <!-- Menu Cards -->
  <div class="menu-container">
    <div class="menu-item" data-name="jollof rice" data-category="meals">
      <h3>Jollof Rice</h3>
      <p class="price">&#8373; 30</p>
    </div>

    <div class="menu-item" data-name="fried plantain" data-category="meals">
      <h3>Fried Plantain</h3>
      <p class="price">&#8373; 15</p>
    </div>

    <div class="menu-item" data-name="coca cola" data-category="drinks">
      <h3>Coca Cola</h3>
      <p class="price">&#8373; 10</p>
    </div>
  </div>

  <!-- Place script right here at the bottom of body -->
  <script src="Menu.js"></script>

</body>
</html>
